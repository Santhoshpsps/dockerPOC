services:
  cassandra:
    image: cassandra:latest
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=mycluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_KEYSPACE=mykeyspace
      - CASSANDRA_USERNAME=cassandra
      - CASSANDRA_PASSWORD=cassandra
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'describe keyspaces'" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: [ "CMD-SHELL", "echo ruok | nc localhost 2181" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "nc -z kafka 9092"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - zookeeper
    networks:
      - app-network

  spring-app:
    build: .
    container_name: spring-app
    ports:
      - "8080:8080"
      - "2200:22"
    healthcheck:
      test: ["CMD", "/bin/sh" ,"-c", "nc -z cassandra 9042 && nc -z localhost 22"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      cassandra:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    environment:
      - SPRING_CASSANDRA_CONTACT_POINTS=cassandra
      - SPRING_CASSANDRA_PORT=9042
      - SPRING_CASSANDRA_KEYSPACE=mykeyspace
      - SPRING_CASSANDRA_USERNAME=cassandra
      - SPRING_CASSANDRA_PASSWORD=cassandra
      - SPRING_CASSANDRA_SCHEMA_ACTION=create_if_not_exists
      - SPRING_CASSANDRA_LOCAL_DATACENTER=datacenter1
    volumes:
      - my_data_volume:/app/app/testFolder
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  my_data_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/santhoshpsps/Downloads/testFolder